spring:
  application:
    name: banking-api
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/banking
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jooq:
    sql-dialect: MYSQL
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    consumer:
      auto-offset-reset: earliest
      group-id: banking-api
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
banking:
  eventsourcing:
    command-stripes: 8
    batch-size: 100
    poll-interval: 100ms
    snapshot-threshold: 100
    max-command-attempts: 3
    deadline-poll-interval: 500ms
